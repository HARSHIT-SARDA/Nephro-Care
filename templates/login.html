<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | NephroCare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f8ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .login-header {
            background: linear-gradient(135deg, #146ef5, #42a5f5);
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        .login-header i {
            font-size: 50px;
        }

        .login-header h2 {
            margin-top: 10px;
            font-weight: 600;
        }

        .login-body {
            padding: 35px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: #146ef5;
            border: none;
        }

        .btn-login:hover {
            background: #0d5bd7;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="login-header">

        <i class="bi bi-heart-pulse-fill"></i>

        <h2>NephroCare</h2>

        <p class="mb-0">
            AI Powered CKD Detection
        </p>

    </div>


    <div class="login-body">

        <h4 class="text-center mb-4">
            Login to Your Account
        </h4>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form action="{{ url_for('login') }}" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-login">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </div>

    </div>

</div>

</body>

</html>
