<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CKD Prediction | NephroCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/prediction.css') }}">

</head>

<body>

<div class="container py-5">

    <div class="card shadow-lg border-0 p-5">

        <h2 class="text-center text-primary mb-4">

            🩺 CKD Prediction Form

        </h2>

        <p class="text-muted text-center mb-4">
            Please enter the six key indicators used by the model for CKD risk assessment.
        </p>

        <form action="/predict" method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Hemoglobin (hemo)</label>

                    <input type="number"
                           name="hemo"
                           step="0.1"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Albumin (al)</label>

                    <input type="number"
                           name="al"
                           step="0.1"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Specific Gravity (sg)</label>

                    <input type="number"
                           name="sg"
                           step="0.001"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Serum Creatinine (sc)</label>

                    <input type="number"
                           name="sc"
                           step="0.1"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Packed Cell Volume (pcv)</label>

                    <input type="number"
                           name="pcv"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Hypertension (htn)</label>

                    <select class="form-select"
                            name="htn">

                        <option value="no">No</option>

                        <option value="yes">Yes</option>

                    </select>

                </div>

            </div>

            <button class="btn btn-primary btn-lg w-100 mt-3">

                🔍 Predict Kidney Disease

            </button>

        </form>

    </div>

</div>

</body>

</html>
